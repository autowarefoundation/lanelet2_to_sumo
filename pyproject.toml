[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ll2sumo"
version = "0.1.0"
description = "Convert Lanelet2 OSM maps into SUMO networks."
readme = "README.md"
requires-python = ">=3.10"
# The converter itself is standard library only. SUMO is a runtime dependency
# because netconvert is executed as a subprocess; install the `sumo` extra to
# get it from PyPI instead of from a host installation or a Docker image.
dependencies = []

[project.optional-dependencies]
# Pinned to the SUMO version the converter is validated against.
sumo = ["eclipse-sumo==1.26.0"]

[project.scripts]
ll2sumo = "ll2sumo.convert:main"

[tool.setuptools]
packages = ["ll2sumo"]
